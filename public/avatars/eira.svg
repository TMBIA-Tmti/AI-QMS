<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b8a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d4f6b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d68a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg)" stroke="#0a3d52" stroke-width="2"/>
  <!-- Inner ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>

  <!-- Clipboard body (document review) -->
  <rect x="36" y="28" width="48" height="62" rx="4" ry="4" fill="#e8f4f8" stroke="#1a6b8a" stroke-width="1.5"/>
  <!-- Clipboard clip -->
  <rect x="48" y="24" width="24" height="10" rx="3" ry="3" fill="#c9a84c" stroke="#a08030" stroke-width="1"/>
  <circle cx="60" cy="29" r="2.5" fill="#0d4f6b"/>

  <!-- Document lines (content being reviewed) -->
  <line x1="43" y1="44" x2="77" y2="44" stroke="#7fb8cc" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="51" x2="70" y2="51" stroke="#7fb8cc" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="58" x2="74" y2="58" stroke="#7fb8cc" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="65" x2="62" y2="65" stroke="#7fb8cc" stroke-width="2" stroke-linecap="round"/>

  <!-- Medical cross (top right of clipboard) -->
  <rect x="66" y="68" width="14" height="14" rx="2" fill="#c0392b" opacity="0.9"/>
  <line x1="73" y1="71" x2="73" y2="79" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="69" y1="75" x2="77" y2="75" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Caduceus / Rod of Asclepius (left side) -->
  <!-- Staff -->
  <line x1="28" y1="35" x2="28" y2="95" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <!-- Wings (simplified) -->
  <path d="M20,38 Q28,30 36,38" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <path d="M22,41 Q28,34 34,41" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Serpent wrapping the rod -->
  <path d="M28,48 C35,50 35,56 28,58 C21,60 21,66 28,68 C35,70 35,76 28,78 C21,80 21,86 28,88"
        fill="none" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Magnifying glass (audit/review, bottom right) -->
  <circle cx="88" cy="88" r="12" fill="none" stroke="#e8f4f8" stroke-width="3" opacity="0.9"/>
  <line x1="96" y1="96" x2="106" y2="106" stroke="#e8f4f8" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Checkmark inside magnifier -->
  <polyline points="82,88 86,92 94,84" fill="none" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "E" letter hint at the bottom center (Eira branding) -->
  <text x="60" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="url(#gold)" font-weight="bold" opacity="0.7">Eira</text>
</svg>
