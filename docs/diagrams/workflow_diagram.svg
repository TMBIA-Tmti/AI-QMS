<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#feca57"/>
    </linearGradient>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4ecdc4"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff6b6b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#4ecdc4" font-size="22" font-weight="bold" font-family="Arial">文件上傳進版流程 (Chainlit v3.1.0)</text>
  
  <!-- Legend -->
  <rect x="680" y="50" width="200" height="80" rx="5" fill="#2d2d44"/>
  <text x="780" y="70" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">圖例</text>
  <rect x="695" y="80" width="20" height="15" rx="3" fill="url(#flowGrad)"/>
  <text x="725" y="92" fill="#ccc" font-size="10">AI 自動處理</text>
  <rect x="695" y="100" width="20" height="15" rx="3" fill="url(#humanGrad)"/>
  <text x="725" y="112" fill="#ccc" font-size="10">人機協同 (Chat 輸入)</text>
  <rect x="695" y="120" width="20" height="15" rx="3" fill="#28a745"/>
  <text x="725" y="132" fill="#ccc" font-size="10">完成節點</text>
  
  <!-- Start Node -->
  <circle cx="100" cy="100" r="25" fill="#4ecdc4"/>
  <text x="100" y="105" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="bold">開始</text>
  
  <line x1="125" y1="100" x2="170" y2="100" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowEnd)"/>
  
  <!-- File Upload (spontaneous_file_upload) -->
  <rect x="180" y="75" width="140" height="50" rx="8" fill="url(#flowGrad)"/>
  <text x="250" y="97" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">📤 文件上傳</text>
  <text x="250" y="112" text-anchor="middle" fill="#ddd" font-size="9">spontaneous_file_upload</text>
  
  <line x1="320" y1="100" x2="365" y2="100" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowEnd)"/>
  
  <!-- MarkItDown OCR -->
  <rect x="375" y="75" width="140" height="50" rx="8" fill="url(#flowGrad)"/>
  <text x="445" y="97" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">📷 MarkItDown OCR</text>
  <text x="445" y="112" text-anchor="middle" fill="#ddd" font-size="9">PDF/Word/Excel→MD</text>
  
  <line x1="445" y1="125" x2="445" y2="160" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowEnd)"/>
  
  <!-- Version + Signature Detection -->
  <rect x="375" y="170" width="140" height="50" rx="8" fill="url(#flowGrad)"/>
  <text x="445" y="190" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">🔍 偵測分析</text>
  <text x="445" y="207" text-anchor="middle" fill="#ddd" font-size="9">版本+簽章+Doc ID</text>
  
  <line x1="445" y1="220" x2="445" y2="260" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowEnd)"/>
  
  <!-- Decision Diamond: Version Check -->
  <polygon points="445,270 530,310 445,350 360,310" fill="#2d2d44" stroke="#ffc107" stroke-width="2"/>
  <text x="445" y="308" text-anchor="middle" fill="#ffc107" font-size="10" font-weight="bold">版本比對</text>
  <text x="445" y="320" text-anchor="middle" fill="#ffc107" font-size="9">registry</text>
  
  <!-- Branch: New Document (left) -->
  <line x1="360" y1="310" x2="250" y2="310" stroke="#4ecdc4" stroke-width="2"/>
  <line x1="250" y1="310" x2="250" y2="370" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowEnd)"/>
  <text x="305" y="300" text-anchor="middle" fill="#4ecdc4" font-size="10">新文件</text>
  
  <!-- Branch: Duplicate (right) -->
  <line x1="530" y1="310" x2="640" y2="310" stroke="#ff6b6b" stroke-width="2"/>
  <text x="585" y="300" text-anchor="middle" fill="#ff6b6b" font-size="10">同版本重複</text>
  
  <rect x="640" y="290" width="180" height="40" rx="8" fill="#ff6b6b"/>
  <text x="730" y="308" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">❌ 拒絕上傳</text>
  <text x="730" y="322" text-anchor="middle" fill="#fff" font-size="8">"同版本文件已存在"</text>
  
  <!-- Branch: Version Update (down) -->
  <line x1="445" y1="350" x2="445" y2="390" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowEnd)"/>
  <text x="470" y="375" fill="#ffc107" font-size="10">進版</text>
  
  <!-- Signature Check (No sig = reject) -->
  <rect x="140" y="380" width="210" height="50" rx="8" fill="url(#flowGrad)"/>
  <text x="245" y="400" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">🔏 簽章檢查</text>
  <text x="245" y="417" text-anchor="middle" fill="#ddd" font-size="9">Signature OR Stamp (擇一)</text>
  
  <!-- No signature reject -->
  <line x1="140" y1="405" x2="80" y2="405" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="100" y="395" fill="#ff6b6b" font-size="9">無簽章</text>
  <rect x="20" y="388" width="55" height="34" rx="5" fill="#ff6b6b"/>
  <text x="47" y="408" text-anchor="middle" fill="#fff" font-size="9">❌ 拒絕</text>
  
  <!-- Has signature → save -->
  <line x1="245" y1="430" x2="245" y2="475" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowEnd)"/>
  <text x="260" y="460" fill="#28a745" font-size="9">通過</text>
  
  <!-- Save new doc -->
  <rect x="170" y="485" width="150" height="45" rx="8" fill="#28a745"/>
  <text x="245" y="505" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">✅ 儲存文件</text>
  <text x="245" y="520" text-anchor="middle" fill="#fff" font-size="9">Markdown DB + Audit</text>
  
  <!-- Version Update flow (center-right) -->
  <rect x="375" y="395" width="200" height="55" rx="8" fill="url(#humanGrad)"/>
  <text x="475" y="415" text-anchor="middle" fill="#1a1a2e" font-size="11" font-weight="bold">🔄 進版確認</text>
  <text x="475" y="430" text-anchor="middle" fill="#333" font-size="9">cl.Action: [📝 確認進版]</text>
  <text x="475" y="443" text-anchor="middle" fill="#333" font-size="8">[❌ 取消]</text>
  
  <!-- Cancel branch -->
  <line x1="575" y1="422" x2="640" y2="422" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="610" y="412" fill="#ff6b6b" font-size="9">取消</text>
  <rect x="640" y="405" width="100" height="35" rx="5" fill="#ff6b6b"/>
  <text x="690" y="427" text-anchor="middle" fill="#fff" font-size="9">❌ 已取消</text>
  
  <!-- Confirm → stamp check message -->
  <line x1="475" y1="450" x2="475" y2="490" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowEnd)"/>
  <text x="490" y="475" fill="#28a745" font-size="9">確認</text>
  
  <!-- Stamp confirmation message -->
  <rect x="380" y="500" width="200" height="55" rx="8" fill="url(#flowGrad)"/>
  <text x="480" y="520" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">📋 確認訊息</text>
  <text x="480" y="535" text-anchor="middle" fill="#ddd" font-size="8">OCR 狀態 + Checklist</text>
  <text x="480" y="547" text-anchor="middle" fill="#ddd" font-size="8">SHA-256 提醒</text>
  
  <line x1="480" y1="555" x2="480" y2="590" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowEnd)"/>
  
  <!-- Confirmer name input (Human in loop) -->
  <rect x="380" y="600" width="200" height="45" rx="8" fill="url(#humanGrad)"/>
  <text x="480" y="620" text-anchor="middle" fill="#1a1a2e" font-size="10" font-weight="bold">👤 輸入確認者姓名</text>
  <text x="480" y="635" text-anchor="middle" fill="#333" font-size="8">Chat Input → Enter</text>
  
  <line x1="480" y1="645" x2="480" y2="675" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowEnd)"/>
  
  <!-- Complete Version Update -->
  <rect x="600" y="655" width="200" height="40" rx="8" fill="#28a745"/>
  <text x="700" y="672" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">✅ 進版完成</text>
  <text x="700" y="688" text-anchor="middle" fill="#fff" font-size="8">舊版刪除 + 新版存入 + Audit</text>
  
  <line x1="480" y1="675" x2="600" y2="675" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowEnd)"/>
  
  <!-- Version info -->
  <text x="850" y="690" text-anchor="end" fill="#666" font-size="10">v3.1.0 | Chainlit + MarkItDown</text>
</svg>
