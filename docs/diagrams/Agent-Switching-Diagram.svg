<?xml version="1.0" encoding="UTF-8"?>
<!-- v3.0.0 - Agent Switching Methods in Chainlit -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="methodAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ECFDF5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1FAE5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="methodBGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="methodCGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDE68A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D97706"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#F9FAFB"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="1200" height="60" fill="url(#headerGrad)"/>
  <text x="600" y="38" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="bold">Chainlit Agent Switching - Three Methods</text>
  <text x="1180" y="38" text-anchor="end" fill="white" font-family="Arial, sans-serif" font-size="12">v3.1.0 | 2026-02-12</text>
  
  <!-- Central User Box -->
  <rect x="475" y="80" width="250" height="60" rx="10" fill="white" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4F46E5">User (Browser)</text>
  <text x="600" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">http://localhost:3000</text>
  
  <!-- ============================================ -->
  <!-- Method A: NLP Routing (Left) - RECOMMENDED -->
  <!-- ============================================ -->
  <g transform="translate(20, 170)">
    <rect x="0" y="0" width="370" height="700" rx="10" fill="url(#methodAGrad)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Method A Header -->
    <rect x="0" y="0" width="370" height="45" rx="10" fill="#059669"/>
    <rect x="0" y="25" width="370" height="20" fill="#059669"/>
    <text x="185" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Method A: NLP Routing (Recommended)</text>
    
    <!-- Step 1: User says intent -->
    <rect x="20" y="60" width="330" height="55" rx="6" fill="white" stroke="#059669" stroke-width="1"/>
    <text x="35" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">Step 1: User expresses intent</text>
    <text x="35" y="100" font-family="Arial, sans-serif" font-size="10" fill="#374151">"I want to upload a file" / "Help me revise SOP"</text>
    
    <!-- Arrow -->
    <path d="M 185 115 L 185 130" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
    
    <!-- Step 2: Main Agent classifies -->
    <rect x="20" y="135" width="330" height="70" rx="6" fill="white" stroke="#059669" stroke-width="1"/>
    <text x="35" y="155" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">Step 2: Main Agent classifies intent</text>
    <rect x="35" y="165" width="300" height="30" rx="4" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="185" y="185" text-anchor="middle" font-family="Courier New, monospace" font-size="9" fill="#166534">@cl.on_message: detect intent via LLM</text>
    
    <!-- Arrow -->
    <path d="M 185 205 L 185 220" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
    
    <!-- Step 3: Set session mode -->
    <rect x="20" y="225" width="330" height="70" rx="6" fill="white" stroke="#059669" stroke-width="1"/>
    <text x="35" y="245" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">Step 3: Switch session mode</text>
    <rect x="35" y="255" width="300" height="30" rx="4" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="185" y="275" text-anchor="middle" font-family="Courier New, monospace" font-size="9" fill="#166534">cl.user_session.set("mode", "doc_control")</text>
    
    <!-- Arrow -->
    <path d="M 185 295 L 185 310" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
    
    <!-- Step 4: Doc Control takes over -->
    <rect x="20" y="315" width="330" height="70" rx="6" fill="white" stroke="#059669" stroke-width="1"/>
    <text x="35" y="335" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">Step 4: Doc Control Agent takes over</text>
    <text x="35" y="355" font-family="Arial, sans-serif" font-size="10" fill="#374151">Subsequent messages routed to doc_control</text>
    <text x="35" y="370" font-family="Arial, sans-serif" font-size="10" fill="#374151">handler instead of main agent handler</text>
    
    <!-- Pros/Cons -->
    <rect x="20" y="400" width="330" height="120" rx="6" fill="white" stroke="#059669" stroke-width="1"/>
    <text x="35" y="420" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">Advantages:</text>
    <text x="35" y="440" font-family="Arial, sans-serif" font-size="10" fill="#374151">+ Most natural AI interaction</text>
    <text x="35" y="455" font-family="Arial, sans-serif" font-size="10" fill="#374151">+ No manual button clicks needed</text>
    <text x="35" y="470" font-family="Arial, sans-serif" font-size="10" fill="#374151">+ Seamless context-aware switching</text>
    <text x="35" y="490" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#DC2626">Considerations:</text>
    <text x="35" y="505" font-family="Arial, sans-serif" font-size="10" fill="#374151">- Requires LLM for intent classification</text>
    
    <!-- Code Example -->
    <rect x="20" y="535" width="330" height="150" rx="6" fill="#1F2937"/>
    <text x="35" y="555" font-family="Courier New, monospace" font-size="9" fill="#10B981"># In @cl.on_message handler:</text>
    <text x="35" y="575" font-family="Courier New, monospace" font-size="9" fill="#E5E7EB">mode = cl.user_session.get("mode")</text>
    <text x="35" y="595" font-family="Courier New, monospace" font-size="9" fill="#E5E7EB">if mode == "doc_control":</text>
    <text x="35" y="615" font-family="Courier New, monospace" font-size="9" fill="#93C5FD">    await handle_doc_control(msg)</text>
    <text x="35" y="635" font-family="Courier New, monospace" font-size="9" fill="#E5E7EB">elif detect_intent(msg) == "upload":</text>
    <text x="35" y="655" font-family="Courier New, monospace" font-size="9" fill="#93C5FD">    cl.user_session.set("mode",</text>
    <text x="35" y="670" font-family="Courier New, monospace" font-size="9" fill="#93C5FD">        "doc_control")</text>
  </g>
  
  <!-- ============================================ -->
  <!-- Method B: cl.Action Buttons (Center) -->
  <!-- ============================================ -->
  <g transform="translate(415, 170)">
    <rect x="0" y="0" width="370" height="700" rx="10" fill="url(#methodBGrad)" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Method B Header -->
    <rect x="0" y="0" width="370" height="45" rx="10" fill="#2563EB"/>
    <rect x="0" y="25" width="370" height="20" fill="#2563EB"/>
    <text x="185" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Method B: cl.Action Buttons</text>
    
    <!-- Step 1: AI shows buttons -->
    <rect x="20" y="60" width="330" height="80" rx="6" fill="white" stroke="#2563EB" stroke-width="1"/>
    <text x="35" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2563EB">Step 1: AI presents module buttons</text>
    <!-- Button mockups -->
    <rect x="35" y="90" width="140" height="28" rx="5" fill="#3B82F6"/>
    <text x="105" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Doc Control</text>
    <rect x="185" y="90" width="140" height="28" rx="5" fill="#8B5CF6"/>
    <text x="255" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Internal Audit</text>
    
    <!-- Arrow -->
    <path d="M 185 140 L 185 155" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
    
    <!-- Step 2: User clicks button -->
    <rect x="20" y="160" width="330" height="55" rx="6" fill="white" stroke="#2563EB" stroke-width="1"/>
    <text x="35" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2563EB">Step 2: User clicks button</text>
    <text x="35" y="200" font-family="Arial, sans-serif" font-size="10" fill="#374151">Clicks [Doc Control Subsystem] button</text>
    
    <!-- Arrow -->
    <path d="M 185 215 L 185 230" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
    
    <!-- Step 3: Action callback fires -->
    <rect x="20" y="235" width="330" height="70" rx="6" fill="white" stroke="#2563EB" stroke-width="1"/>
    <text x="35" y="255" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2563EB">Step 3: @cl.action_callback fires</text>
    <rect x="35" y="265" width="300" height="30" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="185" y="285" text-anchor="middle" font-family="Courier New, monospace" font-size="9" fill="#1E40AF">@cl.action_callback("enter_doc_control")</text>
    
    <!-- Arrow -->
    <path d="M 185 305 L 185 320" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
    
    <!-- Step 4: Mode switch + confirmation -->
    <rect x="20" y="325" width="330" height="70" rx="6" fill="white" stroke="#2563EB" stroke-width="1"/>
    <text x="35" y="345" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2563EB">Step 4: Switch mode + confirm</text>
    <text x="35" y="365" font-family="Arial, sans-serif" font-size="10" fill="#374151">Updates user_session mode flag</text>
    <text x="35" y="380" font-family="Arial, sans-serif" font-size="10" fill="#374151">Sends confirmation message to user</text>
    
    <!-- Pros/Cons -->
    <rect x="20" y="410" width="330" height="120" rx="6" fill="white" stroke="#2563EB" stroke-width="1"/>
    <text x="35" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2563EB">Advantages:</text>
    <text x="35" y="450" font-family="Arial, sans-serif" font-size="10" fill="#374151">+ Clear visual affordance</text>
    <text x="35" y="465" font-family="Arial, sans-serif" font-size="10" fill="#374151">+ No ambiguity in user intent</text>
    <text x="35" y="480" font-family="Arial, sans-serif" font-size="10" fill="#374151">+ Works without LLM classification</text>
    <text x="35" y="500" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#DC2626">Considerations:</text>
    <text x="35" y="515" font-family="Arial, sans-serif" font-size="10" fill="#374151">- Requires explicit user action</text>
    
    <!-- Code Example -->
    <rect x="20" y="545" width="330" height="140" rx="6" fill="#1F2937"/>
    <text x="35" y="565" font-family="Courier New, monospace" font-size="9" fill="#10B981"># Action button definition:</text>
    <text x="35" y="585" font-family="Courier New, monospace" font-size="9" fill="#E5E7EB">actions = [</text>
    <text x="35" y="605" font-family="Courier New, monospace" font-size="9" fill="#93C5FD">  cl.Action(name="enter_doc_ctrl",</text>
    <text x="35" y="625" font-family="Courier New, monospace" font-size="9" fill="#93C5FD">    label="Doc Control")</text>
    <text x="35" y="645" font-family="Courier New, monospace" font-size="9" fill="#E5E7EB">]</text>
    <text x="35" y="665" font-family="Courier New, monospace" font-size="9" fill="#E5E7EB">await cl.Message(</text>
    <text x="35" y="680" font-family="Courier New, monospace" font-size="9" fill="#93C5FD">  actions=actions).send()</text>
  </g>
  
  <!-- ============================================ -->
  <!-- Method C: ChatSettings / Header (Right) -->
  <!-- ============================================ -->
  <g transform="translate(810, 170)">
    <rect x="0" y="0" width="370" height="700" rx="10" fill="url(#methodCGrad)" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Method C Header -->
    <rect x="0" y="0" width="370" height="45" rx="10" fill="#D97706"/>
    <rect x="0" y="25" width="370" height="20" fill="#D97706"/>
    <text x="185" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Method C: Chat Profile Dropdown</text>
    
    <!-- Step 1: Profile dropdown -->
    <rect x="20" y="60" width="330" height="80" rx="6" fill="white" stroke="#D97706" stroke-width="1"/>
    <text x="35" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#D97706">Step 1: User opens profile dropdown</text>
    <!-- Dropdown mockup -->
    <rect x="35" y="90" width="200" height="25" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    <text x="45" y="108" font-family="Arial, sans-serif" font-size="10" fill="#92400E">Main Agent (Total Manager) v</text>
    <rect x="35" y="115" width="200" height="20" rx="0" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="45" y="130" font-family="Arial, sans-serif" font-size="9" fill="#92400E">Doc Control</text>
    
    <!-- Arrow -->
    <path d="M 185 140 L 185 155" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
    
    <!-- Step 2: Select profile -->
    <rect x="20" y="160" width="330" height="55" rx="6" fill="white" stroke="#D97706" stroke-width="1"/>
    <text x="35" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#D97706">Step 2: Select "Doc Control" profile</text>
    <text x="35" y="200" font-family="Arial, sans-serif" font-size="10" fill="#374151">Chainlit shows confirmation dialog</text>
    
    <!-- Arrow -->
    <path d="M 185 215 L 185 230" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
    
    <!-- Step 3: @cl.set_chat_profiles -->
    <rect x="20" y="235" width="330" height="70" rx="6" fill="white" stroke="#D97706" stroke-width="1"/>
    <text x="35" y="255" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#D97706">Step 3: Profile switch triggers</text>
    <rect x="35" y="265" width="300" height="30" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="185" y="285" text-anchor="middle" font-family="Courier New, monospace" font-size="9" fill="#92400E">@cl.on_chat_start (new profile context)</text>
    
    <!-- Arrow -->
    <path d="M 185 305 L 185 320" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
    
    <!-- Step 4: New chat session -->
    <rect x="20" y="325" width="330" height="70" rx="6" fill="white" stroke="#D97706" stroke-width="1"/>
    <text x="35" y="345" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#D97706">Step 4: New chat session starts</text>
    <text x="35" y="365" font-family="Arial, sans-serif" font-size="10" fill="#374151">Doc Control welcome message appears</text>
    <text x="35" y="380" font-family="Arial, sans-serif" font-size="10" fill="#374151">File upload enabled, OCR ready</text>
    
    <!-- Pros/Cons -->
    <rect x="20" y="410" width="330" height="120" rx="6" fill="white" stroke="#D97706" stroke-width="1"/>
    <text x="35" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#D97706">Advantages:</text>
    <text x="35" y="450" font-family="Arial, sans-serif" font-size="10" fill="#374151">+ Built-in Chainlit feature</text>
    <text x="35" y="465" font-family="Arial, sans-serif" font-size="10" fill="#374151">+ Always visible in header</text>
    <text x="35" y="480" font-family="Arial, sans-serif" font-size="10" fill="#374151">+ Clean session separation</text>
    <text x="35" y="500" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#DC2626">Considerations:</text>
    <text x="35" y="515" font-family="Arial, sans-serif" font-size="10" fill="#374151">- Creates new chat (loses context)</text>
    
    <!-- Code Example -->
    <rect x="20" y="545" width="330" height="140" rx="6" fill="#1F2937"/>
    <text x="35" y="565" font-family="Courier New, monospace" font-size="9" fill="#10B981"># Profile definition:</text>
    <text x="35" y="585" font-family="Courier New, monospace" font-size="9" fill="#E5E7EB">@cl.set_chat_profiles</text>
    <text x="35" y="605" font-family="Courier New, monospace" font-size="9" fill="#E5E7EB">async def profiles():</text>
    <text x="35" y="625" font-family="Courier New, monospace" font-size="9" fill="#93C5FD">  return [</text>
    <text x="35" y="645" font-family="Courier New, monospace" font-size="9" fill="#93C5FD">    cl.ChatProfile(name="Main"),</text>
    <text x="35" y="665" font-family="Courier New, monospace" font-size="9" fill="#93C5FD">    cl.ChatProfile(name="DocCtrl"),</text>
    <text x="35" y="680" font-family="Courier New, monospace" font-size="9" fill="#E5E7EB">  ]</text>
  </g>
  
  <!-- Arrows from User to Methods -->
  <path d="M 500 140 L 205 170" stroke="#059669" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <path d="M 600 140 L 600 170" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>
  <path d="M 700 140 L 995 170" stroke="#D97706" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowAmber)"/>
  
  <!-- Current Implementation Badge -->
  <rect x="810" y="875" width="370" height="25" rx="5" fill="#D97706" filter="url(#shadow)"/>
  <text x="995" y="892" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">CURRENT: v3.1.0 uses Method C (Chat Profiles)</text>
  
  <!-- Recommendation Badge -->
  <rect x="20" y="875" width="370" height="25" rx="5" fill="#059669" filter="url(#shadow)"/>
  <text x="205" y="892" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">RECOMMENDED: Method A (NLP Routing)</text>
  
  <!-- Combined Badge -->
  <rect x="415" y="875" width="370" height="25" rx="5" fill="#2563EB" filter="url(#shadow)"/>
  <text x="600" y="892" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">HYBRID: Combine A + B for best UX</text>
</svg>
