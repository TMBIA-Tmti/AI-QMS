<?xml version="1.0" encoding="UTF-8"?>
<!-- v3.1.0 - Chainlit Doc Control Profile UI Mockup -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" width="1100" height="880">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Browser Frame -->
  <rect width="1100" height="880" fill="#F3F4F6" rx="8"/>
  
  <!-- Browser Header -->
  <rect x="0" y="0" width="1100" height="35" fill="#E5E7EB" rx="8"/>
  <circle cx="20" cy="17" r="6" fill="#EF4444"/>
  <circle cx="40" cy="17" r="6" fill="#F59E0B"/>
  <circle cx="60" cy="17" r="6" fill="#10B981"/>
  <rect x="100" y="8" width="350" height="20" rx="4" fill="white"/>
  <text x="120" y="22" font-family="Arial" font-size="10" fill="#6B7280">localhost:3000 - AI-QMS</text>
  
  <!-- Chainlit Top Bar -->
  <rect x="0" y="35" width="1100" height="50" fill="url(#headerGrad)"/>
  <rect x="15" y="48" width="28" height="24" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="22" y="65" font-family="Arial" font-size="14" fill="white">=</text>
  <text x="55" y="66" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.7)">History</text>
  <text x="550" y="66" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">AI-QMS - 文件管制模式</text>
  <rect x="1040" y="48" width="40" height="24" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="1052" y="65" font-family="Arial" font-size="14" fill="white">⚙️</text>
  
  <!-- Left Sidebar -->
  <rect x="0" y="85" width="220" height="795" fill="#1F2937"/>
  <text x="15" y="110" font-family="Arial" font-size="11" font-weight="bold" fill="#9CA3AF">Recent Sessions</text>
  <rect x="10" y="120" width="200" height="35" rx="5" fill="#374151"/>
  <text x="20" y="142" font-family="Arial" font-size="10" fill="#D1D5DB">QM-001 V2 進版確認</text>
  <rect x="10" y="162" width="200" height="35" rx="5" fill="#374151"/>
  <text x="20" y="184" font-family="Arial" font-size="10" fill="#D1D5DB">批次上傳 5 檔</text>
  <rect x="10" y="204" width="200" height="35" rx="5" fill="#374151"/>
  <text x="20" y="226" font-family="Arial" font-size="10" fill="#D1D5DB">FM-852-01 作廢</text>
  
  <!-- Profile Dropdown -->
  <rect x="230" y="95" width="260" height="30" rx="4" fill="#F0F9FF" stroke="#93C5FD" stroke-width="1"/>
  <text x="245" y="115" font-family="Arial" font-size="11" font-weight="bold" fill="#1E40AF">Profile: 文件管制 (Doc Control)</text>
  <text x="475" y="115" font-family="Arial" font-size="10" fill="#6B7280">▼</text>
  
  <!-- Main Content Area -->
  <rect x="230" y="130" width="860" height="640" fill="white" rx="8" filter="url(#shadow)"/>
  
  <!-- Welcome message -->
  <rect x="250" y="145" width="600" height="45" rx="8" fill="#EFF6FF"/>
  <text x="265" y="165" font-family="Arial" font-size="12" font-weight="bold" fill="#1E40AF">AI Assistant (文件管制模式)</text>
  <text x="265" y="182" font-family="Arial" font-size="10" fill="#374151">歡迎進入文件管制模式。可上傳文件、輸入「列表」「文件清單」「法規清單」或「作廢 [doc_id]」。</text>
  
  <!-- User uploads file -->
  <rect x="600" y="200" width="400" height="30" rx="8" fill="#DBEAFE"/>
  <text x="615" y="220" font-family="Arial" font-size="11" fill="#1E40AF">User: [附件: QM-001 ISO 13485 Quality Manual.pdf]</text>
  
  <!-- AI Processing Steps -->
  <rect x="250" y="245" width="650" height="140" rx="8" fill="#EFF6FF"/>
  <text x="270" y="268" font-family="Arial" font-size="12" font-weight="bold" fill="#1E40AF">AI Assistant</text>
  <text x="270" y="288" font-family="Arial" font-size="11" fill="#374151">已偵測到文件上傳，正在處理...</text>
  
  <!-- Processing Steps -->
  <rect x="270" y="298" width="600" height="78" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1"/>
  
  <circle cx="290" cy="316" r="8" fill="#10B981"/>
  <text x="286" y="320" font-family="Arial" font-size="10" fill="white" font-weight="bold">✓</text>
  <text x="305" y="320" font-family="Arial" font-size="10" fill="#374151">MarkItDown OCR 完成 (PDF → Markdown)</text>
  
  <circle cx="290" cy="340" r="8" fill="#10B981"/>
  <text x="286" y="344" font-family="Arial" font-size="10" fill="white" font-weight="bold">✓</text>
  <text x="305" y="344" font-family="Arial" font-size="10" fill="#374151">版本偵測: V2 | 簽章偵測: ✓ 蓋章已偵測 | Doc ID: QM-001</text>
  
  <circle cx="290" cy="364" r="8" fill="#F59E0B"/>
  <text x="286" y="368" font-family="Arial" font-size="10" fill="white" font-weight="bold">!</text>
  <text x="305" y="368" font-family="Arial" font-size="10" font-weight="bold" fill="#D97706">🔄 偵測到新版本 (QM-001 V1 → V2) (進版)</text>
  
  <!-- Action Buttons for Version Update -->
  <rect x="250" y="400" width="650" height="70" rx="8" fill="#EFF6FF"/>
  <text x="270" y="420" font-family="Arial" font-size="11" font-weight="bold" fill="#1E40AF">請確認操作：</text>
  
  <!-- cl.Action Buttons -->
  <rect x="270" y="430" width="220" height="30" rx="6" fill="#3B82F6" filter="url(#shadow)"/>
  <text x="380" y="450" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">📝 確認為文件進版</text>
  
  <rect x="510" y="430" width="100" height="30" rx="6" fill="#EF4444" filter="url(#shadow)"/>
  <text x="560" y="450" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">❌ 取消</text>
  
  <!-- User clicks confirm -->
  <rect x="700" y="485" width="200" height="25" rx="8" fill="#DBEAFE"/>
  <text x="715" y="502" font-family="Arial" font-size="10" fill="#1E40AF">User clicked: [📝 確認為文件進版]</text>
  
  <!-- Stamp Confirmation Message -->
  <rect x="250" y="525" width="650" height="100" rx="8" fill="#EFF6FF"/>
  <text x="270" y="548" font-family="Arial" font-size="12" font-weight="bold" fill="#1E40AF">AI Assistant</text>
  <text x="270" y="568" font-family="Arial" font-size="10" fill="#374151">📋 OCR 偵測: 版本 V2 ✅ | 蓋章 ✅</text>
  <text x="270" y="585" font-family="Arial" font-size="10" fill="#374151">✅ 主管審核簽章 | ✅ 品保確認蓋章</text>
  <text x="270" y="602" font-family="Arial" font-size="10" fill="#DC2626">⚠️ 確認後將產生 SHA-256 防竄改稽核紀錄</text>
  <text x="270" y="619" font-family="Arial" font-size="10" font-weight="bold" fill="#059669">請在聊天輸入框輸入確認者姓名並按 Enter</text>
  
  <!-- User types confirmer name -->
  <rect x="700" y="635" width="200" height="25" rx="8" fill="#DBEAFE"/>
  <text x="715" y="652" font-family="Arial" font-size="10" fill="#1E40AF">User: 王小明</text>
  
  <!-- Success message -->
  <rect x="250" y="670" width="650" height="55" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="270" y="693" font-family="Arial" font-size="11" font-weight="bold" fill="#059669">✅ 文件進版完成！</text>
  <text x="270" y="710" font-family="Arial" font-size="10" fill="#374151">QM-001 V1 → V2 | 確認者: 王小明 | SHA-256: a1b2c3d4... | 舊版已刪除</text>
  
  <!-- Download link -->
  <rect x="250" y="730" width="350" height="25" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="260" y="747" font-family="Arial" font-size="10" fill="#1E40AF">📎 cl.File: QM-001 ISO 13485 Quality Manual.pdf (下載原始檔)</text>
  
  <!-- Chat Input -->
  <rect x="240" y="770" width="840" height="30" rx="8" fill="#F3F4F6" stroke="#3B82F6" stroke-width="1"/>
  <text x="260" y="790" font-family="Arial" font-size="11" fill="#9CA3AF">輸入訊息或拖曳檔案上傳...</text>
  <rect x="1030" y="774" width="40" height="22" rx="4" fill="#3B82F6"/>
  <text x="1043" y="790" font-family="Arial" font-size="10" fill="white">Send</text>
  
  <!-- Footer -->
  <rect x="0" y="820" width="1100" height="60" fill="#F3F4F6"/>
  <text x="550" y="845" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#374151">Doc Control Profile UI (Chainlit v3.1.0 - Port 3000)</text>
  <text x="550" y="865" text-anchor="middle" font-family="Arial" font-size="10" fill="#6B7280">POC Scope | 15 File Limit | MarkItDown OCR | cl.Action Buttons | cl.File Download | Markdown DB (No-Hallucination)</text>
  
  <!-- Annotations -->
  <line x1="490" y1="460" x2="490" y2="480" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="500" y="478" font-family="Arial" font-size="8" fill="#059669">@cl.action_callback("confirm_version_update")</text>
  
  <line x1="450" y1="755" x2="450" y2="768" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="460" y="766" font-family="Arial" font-size="8" fill="#D97706">MarkdownStorageManager.save_ocr_document() → Audit Log</text>
</svg>
