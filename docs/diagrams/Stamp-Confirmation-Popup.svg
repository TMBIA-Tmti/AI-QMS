<?xml version="1.0" encoding="UTF-8"?>
<!-- v3.1.0 - Chainlit Chat-Based Stamp/Version Confirmation Flow -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background (simulating Chainlit chat area) -->
  <rect width="600" height="700" fill="#F3F4F6" rx="8"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="600" height="40" fill="#3B82F6" rx="8"/>
  <rect x="0" y="20" width="600" height="20" fill="#3B82F6"/>
  <text x="300" y="26" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">進版簽章確認流程 (Chat-Based)</text>
  
  <!-- Step 1: Version Update Detection -->
  <rect x="20" y="55" width="560" height="85" rx="8" fill="#EFF6FF" filter="url(#shadow)"/>
  <text x="35" y="75" font-family="Arial" font-size="11" font-weight="bold" fill="#1E40AF">AI Assistant</text>
  <text x="35" y="95" font-family="Arial" font-size="10" fill="#374151">🔄 偵測到新版本 (QM-001 V1 → V2)</text>
  
  <!-- Action Buttons -->
  <rect x="35" y="108" width="180" height="25" rx="5" fill="#3B82F6"/>
  <text x="125" y="125" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">📝 確認為文件進版</text>
  <rect x="225" y="108" width="80" height="25" rx="5" fill="#EF4444"/>
  <text x="265" y="125" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">❌ 取消</text>
  
  <!-- Step label -->
  <rect x="470" y="55" width="100" height="20" rx="4" fill="#DBEAFE"/>
  <text x="520" y="69" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#1E40AF">Step 1: 偵測</text>
  
  <!-- User clicks confirm button -->
  <rect x="300" y="155" width="270" height="25" rx="8" fill="#DBEAFE"/>
  <text x="310" y="172" font-family="Arial" font-size="10" fill="#1E40AF">User clicked: [📝 確認為文件進版]</text>
  
  <!-- Step 2: Confirmation Message -->
  <rect x="20" y="195" width="560" height="180" rx="8" fill="#EFF6FF" filter="url(#shadow)"/>
  <text x="35" y="218" font-family="Arial" font-size="11" font-weight="bold" fill="#1E40AF">AI Assistant</text>
  
  <!-- OCR Status -->
  <rect x="35" y="228" width="530" height="50" rx="6" fill="white" stroke="#3B82F6" stroke-width="1"/>
  <text x="50" y="248" font-family="Arial" font-size="10" font-weight="bold" fill="#1E40AF">🔍 OCR 偵測結果</text>
  <text x="50" y="268" font-family="Arial" font-size="10" fill="#374151">版本: V2 (來源: "Version: 2.0") ✅ | 簽章/蓋章: 已偵測到蓋章 ✅</text>
  
  <!-- Checklist -->
  <rect x="35" y="288" width="530" height="45" rx="6" fill="white" stroke="#10B981" stroke-width="1"/>
  <rect x="50" y="298" width="14" height="14" rx="3" fill="#10B981"/>
  <text x="54" y="310" font-family="Arial" font-size="10" fill="white" font-weight="bold">✓</text>
  <text x="72" y="310" font-family="Arial" font-size="10" fill="#374151">主管審核簽章完成</text>
  <rect x="250" y="298" width="14" height="14" rx="3" fill="#10B981"/>
  <text x="254" y="310" font-family="Arial" font-size="10" fill="white" font-weight="bold">✓</text>
  <text x="272" y="310" font-family="Arial" font-size="10" fill="#374151">品保確認蓋章完成</text>
  <text x="50" y="328" font-family="Arial" font-size="9" fill="#6B7280">□ 管理代表核准 (若適用)</text>
  
  <!-- SHA-256 Warning -->
  <rect x="35" y="340" width="530" height="25" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="50" y="357" font-family="Arial" font-size="10" font-weight="bold" fill="#DC2626">⚠️ 確認後將產生不可竄改的 SHA-256 防竄改稽核紀錄</text>
  
  <!-- Step label -->
  <rect x="470" y="195" width="100" height="20" rx="4" fill="#DBEAFE"/>
  <text x="520" y="209" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#1E40AF">Step 2: 確認</text>
  
  <!-- Step 3: Request confirmer name -->
  <rect x="20" y="390" width="560" height="40" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="35" y="415" font-family="Arial" font-size="11" font-weight="bold" fill="#059669">👤 請在聊天輸入框輸入確認者姓名並按 Enter</text>
  
  <!-- Step label -->
  <rect x="470" y="390" width="100" height="20" rx="4" fill="#D1FAE5"/>
  <text x="520" y="404" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#065F46">Step 3: 輸入</text>
  
  <!-- Chat Input Box (highlighted) -->
  <rect x="20" y="445" width="560" height="35" rx="8" fill="white" stroke="#10B981" stroke-width="2"/>
  <text x="35" y="467" font-family="Arial" font-size="12" fill="#374151">王小明</text>
  <rect x="530" y="449" width="40" height="25" rx="4" fill="#10B981"/>
  <text x="542" y="467" font-family="Arial" font-size="10" fill="white">Enter</text>
  
  <!-- User message -->
  <rect x="400" y="495" width="170" height="25" rx="8" fill="#DBEAFE"/>
  <text x="410" y="512" font-family="Arial" font-size="10" fill="#1E40AF">User: 王小明</text>
  
  <!-- Step 4: Completion -->
  <rect x="20" y="535" width="560" height="100" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="35" y="558" font-family="Arial" font-size="11" font-weight="bold" fill="#059669">AI Assistant</text>
  <text x="35" y="578" font-family="Arial" font-size="11" font-weight="bold" fill="#059669">✅ 文件進版完成！</text>
  <text x="35" y="598" font-family="Arial" font-size="10" fill="#374151">QM-001 V1 → V2 | 確認者: 王小明 | 時間: 2026-02-12 15:30</text>
  <text x="35" y="615" font-family="Arial" font-size="10" fill="#374151">SHA-256: a1b2c3d4e5f6... | 舊版本檔案已刪除 (僅保留 Audit Log)</text>
  <text x="35" y="630" font-family="Arial" font-size="10" fill="#3B82F6">📎 QM-001 ISO 13485 Quality Manual.pdf (下載原始檔)</text>
  
  <!-- Step label -->
  <rect x="470" y="535" width="100" height="20" rx="4" fill="#D1FAE5"/>
  <text x="520" y="549" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#065F46">Step 4: 完成</text>
  
  <!-- Footer -->
  <rect x="20" y="650" width="560" height="35" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="300" y="665" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#92400E">v3.1.0 進版確認流程: Chat-Based (非彈窗)</text>
  <text x="300" y="680" text-anchor="middle" font-family="Arial" font-size="9" fill="#78350F">cl.Action Button → 確認訊息 → Chat Input 姓名 → SHA-256 Audit</text>
</svg>
